<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="foldGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B6FE0"/>
      <stop offset="45%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#F4E27A"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E63D6"/>
      <stop offset="50%" stop-color="#3FB37F"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- ===== Carte / document (fond blanc, coin corné) ===== -->
  <rect x="20" y="20" width="360" height="360" rx="64" fill="#FFFFFF" stroke="url(#cardStroke)" stroke-width="3"/>

  <!-- coin corné (dégradé bleu / violet / jaune) qui se replie en bas à droite -->
  <path d="M 380 288
           L 380 316
           A 64 64 0 0 1 316 380
           L 288 380
           Z"
        fill="url(#foldGradient)"/>
  <path d="M 292 380 Q 330 366 366 292" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.55"/>
  <path d="M 380 288 L 292 380" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.35"/>

  <!-- ===== Titre ===== -->
  <text x="52" y="112" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="800" font-size="52">
    <tspan fill="#1D4FC4">Nka</tspan><tspan fill="#2FA84F" dx="14">Bulletin</tspan>
  </text>
  <rect x="52" y="128" width="230" height="4" rx="2" fill="#1A2340"/>

  <!-- ===== Badge de vérification (coche) ===== -->
  <circle cx="330" cy="72" r="42" fill="#FFFFFF" stroke="#2FA84F" stroke-width="3"/>
  <path d="M 311 74 L 324 87 L 351 58" fill="none" stroke="#1D4FC4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 311 74 L 324 87 L 351 58" fill="none" stroke="#2FA84F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== Lignes de contenu (gauche) ===== -->
  <rect x="52" y="160" width="180" height="16" rx="8" fill="#F3EFA0"/>
  <rect x="52" y="188" width="140" height="14" rx="7" fill="#FFFFFF" stroke="#2E63D6" stroke-width="2.4"/>
  <rect x="52" y="212" width="100" height="14" rx="7" fill="#FFFFFF" stroke="#2E63D6" stroke-width="2.4"/>
  <rect x="52" y="236" width="120" height="14" rx="7" fill="#FFFFFF" stroke="#2E63D6" stroke-width="2.4"/>

  <!-- ===== Lignes de contenu (droite) ===== -->
  <rect x="252" y="160" width="80" height="14" rx="7" fill="#F3EFA0"/>
  <rect x="252" y="188" width="90" height="14" rx="7" fill="#FFFFFF" stroke="#2E63D6" stroke-width="2.4"/>
  <rect x="252" y="212" width="70" height="14" rx="7" fill="#FFFFFF" stroke="#2E63D6" stroke-width="2.4"/>

  <!-- ===== Cadenas central (sécurité / PIN) ===== -->
  <g transform="translate(200,300)">
    <path d="M -38 -34 V -50 A 38 38 0 0 1 38 -50 V -34" fill="none" stroke="#1D4FC4" stroke-width="10" stroke-linecap="round"/>
    <rect x="-58" y="-34" width="116" height="98" rx="20" fill="#FFFFFF" stroke="#1D4FC4" stroke-width="6"/>

    <!-- empreinte digitale (arcs concentriques) -->
    <path d="M -30 30 A 30 26 0 0 1 30 30" fill="none" stroke="#2E63D6" stroke-width="4" stroke-linecap="round"/>
    <path d="M -22 22 A 22 20 0 0 1 22 22" fill="none" stroke="#2E63D6" stroke-width="4" stroke-linecap="round"/>
    <path d="M -14 16 A 14 13 0 0 1 14 16" fill="none" stroke="#2E63D6" stroke-width="4" stroke-linecap="round"/>
    <path d="M -30 30 Q -30 44 0 46 Q 30 44 30 30" fill="none" stroke="#2E63D6" stroke-width="4" stroke-linecap="round"/>

    <!-- trou de serrure -->
    <circle cx="0" cy="4" r="9" fill="#FFFFFF" stroke="#F3EFA0" stroke-width="4"/>
    <path d="M -6 10 L 0 24 L 6 10 Z" fill="#FFFFFF" stroke="#F3EFA0" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- ===== Ligne de contenu (bas) ===== -->
  <rect x="52" y="358" width="140" height="12" rx="6" fill="#FFFFFF" stroke="#2E63D6" stroke-width="2.4"/>
</svg>
