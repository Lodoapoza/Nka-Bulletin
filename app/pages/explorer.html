<div class="page">
  <h1 class="page-title">Explorer</h1>
  <p class="page-subtitle">Recherchez et filtrez vos bulletins</p>

  <!-- Search Bar -->
  <div class="search-bar">
    <span class="search-bar__icon">🔍</span>
    <input class="search-bar__input" type="search" id="explorer-search" placeholder="Rechercher un bulletin…" autocomplete="off">
  </div>

  <!-- Filters -->
  <div class="chip-group" id="explorer-years">
    <button class="skeleton" style="width:48px;height:30px;border-radius:var(--radius-full);border:none"></button>
    <button class="skeleton" style="width:60px;height:30px;border-radius:var(--radius-full);border:none"></button>
    <button class="skeleton" style="width:60px;height:30px;border-radius:var(--radius-full);border:none"></button>
  </div>

  <div class="chip-group" id="explorer-months">
    <button class="skeleton" style="width:44px;height:30px;border-radius:var(--radius-full);border:none"></button>
    <button class="skeleton" style="width:48px;height:30px;border-radius:var(--radius-full);border:none"></button>
    <button class="skeleton" style="width:44px;height:30px;border-radius:var(--radius-full);border:none"></button>
  </div>

  <!-- Filter actions -->
  <div style="display:flex;gap:var(--space-sm);margin-bottom:var(--space-lg);flex-wrap:wrap">
    <button class="chip chip--filter" id="explorer-fav-toggle">
      ❤️ Favoris uniquement
    </button>
    <button class="btn btn--ghost btn--small" id="explorer-select">
      ☑️ Sélectionner
    </button>
  </div>

  <!-- Bulletin List -->
  <div id="explorer-list">
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
  </div>
</div>

<!-- Multi-select Bar -->
<div class="multi-select-bar" id="multi-select-bar">
  <span class="multi-select-bar__count" id="select-count">0 sélectionné(s)</span>
  <button class="multi-select-bar__btn multi-select-bar__btn--cancel" id="select-cancel">Annuler</button>
  <button class="multi-select-bar__btn multi-select-bar__btn--merge" id="merge-btn">Fusionner</button>
</div>
