<div class="page">
  <h1 class="page-title">Bonjour 👋</h1>
  <p class="page-subtitle">Voici le résumé de vos bulletins de paie</p>

  <!-- Stats Grid -->
  <div class="stats-grid" id="dashboard-stats">
    <div class="skeleton skeleton-stat"></div>
    <div class="skeleton skeleton-stat"></div>
    <div class="skeleton skeleton-stat"></div>
    <div class="skeleton skeleton-stat"></div>
  </div>

  <!-- Dernière synchronisation -->
  <div id="sync-info" style="font-size:var(--text-xs);color:var(--text-tertiary);text-align:center;margin-bottom:var(--space-lg)"></div>

  <!-- Actions rapides -->
  <div class="section-title">Actions rapides</div>
  <div class="quick-actions" id="dashboard-actions">
    <button class="skeleton" style="width:100px;height:36px;border-radius:var(--radius-full);border:none"></button>
    <button class="skeleton" style="width:120px;height:36px;border-radius:var(--radius-full);border:none"></button>
  </div>
</div>

<!-- FAB Sync -->
<button class="fab" id="sync-btn" aria-label="Synchroniser">🔄</button>
