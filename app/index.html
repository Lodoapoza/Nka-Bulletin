<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#006A6A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Nka Bulletin</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/icon.png">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app-shell">
    <header class="app-header" role="banner">
      <button class="header-back" aria-label="Retour">←</button>
      <div>
        <div class="app-header__title">Nka Bulletin</div>
        <div class="app-header__subtitle">Tableau de bord</div>
      </div>
      <div class="app-header__actions"></div>
    </header>
    <main id="app-content" role="main">
      <div class="loading-screen">
        <div class="spinner"></div>
      </div>
    </main>
    <nav class="bottom-nav" role="navigation" aria-label="Navigation principale">
      <button class="nav-item active" data-page="dashboard" onclick="window.location.hash='dashboard'" aria-label="Tableau de bord">
        <span class="nav-item__icon">🏠</span>
        <span class="nav-item__label">Dashboard</span>
      </button>
      <button class="nav-item" data-page="explorer" onclick="window.location.hash='explorer'" aria-label="Explorer">
        <span class="nav-item__icon">📂</span>
        <span class="nav-item__label">Explorer</span>
      </button>
      <button class="nav-item" data-page="settings" onclick="window.location.hash='settings'" aria-label="Paramètres">
        <span class="nav-item__icon">⚙️</span>
        <span class="nav-item__label">Paramètres</span>
      </button>
    </nav>
  </div>
</body>
</html>
