name: nka_bulletin
description: Nka Bulletin - Application de gestion de bulletins scolaires
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  go_router: ^13.0.0
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.8
  dio: ^5.4.0
  flutter_appauth: ^6.0.0
  google_sign_in: ^6.1.6
  workmanager: ^0.5.2
  http: ^1.1.2
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  pdf: ^3.10.7
  open_file: ^3.3.2
  permission_handler: ^11.1.0
  flutter_local_notifications: ^16.3.0
  connectivity_plus: ^5.0.2
  url_launcher: ^6.2.2

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
