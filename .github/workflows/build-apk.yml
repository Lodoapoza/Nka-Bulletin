name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk ${{ inputs.build_type == 'release' && '--release' || '--debug' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nka-bulletin-${{ inputs.build_type }}
          path: build/app/outputs/flutter-apk/
