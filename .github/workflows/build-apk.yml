name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons & splash
        run: npx capacitor-assets generate --android

      - name: Ensure android assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor config & plugins
        run: npx cap sync

      - name: Configure release signing
        if: github.event.inputs.build_type == 'release'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 ../.github/scripts/configure-signing.py

      - name: Build APK
        run: |
          cd android
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Verify APK signature
        if: github.event.inputs.build_type == 'release'
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "Vérification: $APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK" | head -15

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nka-bulletin-${{ github.event.inputs.build_type }}
          path: app/android/app/build/outputs/apk/${{ github.event.inputs.build_type }}/
