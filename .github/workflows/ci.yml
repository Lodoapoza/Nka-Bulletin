name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate backend code
        run: |
          echo "=== Checking package.json ==="
          python3 -m json.tool package.json > /dev/null && echo "  ok"
          echo "=== Checking JS syntax ==="
          node -e "
            const fs = require('fs');
            const path = require('path');
            function walk(dir) {
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              for (const e of entries) {
                const p = path.join(dir, e.name);
                if (e.isDirectory() && e.name !== 'node_modules') walk(p);
                else if (e.name.endsWith('.js')) {
                  try {
                    require('child_process').execSync('node --check ' + JSON.stringify(p), { stdio: 'pipe' });
                    console.log('  ok  ' + path.relative('.', p));
                  } catch (err) {
                    console.log('  FAIL ' + path.relative('.', p));
                    process.exit(1);
                  }
                }
              }
            }
            walk('.');
          "
          echo "All backend JS files valid"

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Frontend files
        working-directory: frontend
        run: |
          ERR=0
          for f in index.html manifest.json sworker.js js/theme.js js/version.js js/client.js js/app.js js/pin.js js/dashboard.js js/accounts.js js/bulletins.js js/settings.js js/capacitor.js css/app.css; do
            test -f "$f" && echo "  ok  $f" || { echo "  MISS  $f"; ERR=1; }
          done
          node --check sworker.js && echo "  ok  sworker.js syntax"
          node --check js/theme.js && echo "  ok  js/theme.js syntax"
          node --check js/version.js && echo "  ok  js/version.js syntax"
          node --check js/client.js && echo "  ok  js/client.js syntax"
          node --check js/app.js && echo "  ok  js/app.js syntax"
          node --check js/pin.js && echo "  ok  js/pin.js syntax"
          node --check js/dashboard.js && echo "  ok  js/dashboard.js syntax"
          node --check js/accounts.js && echo "  ok  js/accounts.js syntax"
          node --check js/bulletins.js && echo "  ok  js/bulletins.js syntax"
          node --check js/settings.js && echo "  ok  js/settings.js syntax"
          node --check js/capacitor.js && echo "  ok  js/capacitor.js syntax"
          python3 -m json.tool manifest.json > /dev/null && echo "  ok  manifest.json is valid JSON" || { echo "  FAIL  manifest.json is invalid"; ERR=1; }
          exit $ERR

      - name: Validate Capacitor config
        working-directory: app
        run: |
          test -f package.json || { echo "No app directory"; exit 0; }
          test -f capacitor.config.json || { echo "MISSING capacitor.config.json"; exit 1; }
          python3 -m json.tool capacitor.config.json > /dev/null && echo "  ok  capacitor.config.json is valid JSON" || { echo "  FAIL  invalid JSON"; exit 1; }
