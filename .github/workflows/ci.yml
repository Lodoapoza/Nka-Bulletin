name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Backend
        working-directory: backend
        run: |
          npm install
          node src/index.js &
          SERVER_PID=$!
          sleep 5
          curl -f http://localhost:3000/api/health
          curl -f http://localhost:3000/api/auth/password/status
          curl -f http://localhost:3000/api/settings
          curl -f http://localhost:3000/api/stats/dashboard
          kill $SERVER_PID

      - name: Validate Frontend
        working-directory: frontend
        run: |
          test -f index.html
          test -f manifest.json
          test -f sw.js
          test -f js/api.js
          test -f js/app.js
          test -f js/pin.js
          test -f js/dashboard.js
          test -f js/accounts.js
          test -f js/bulletins.js
          test -f js/settings.js
          test -f css/styles.css
          echo "All required files present"

      - name: Validate PWA Manifest
        working-directory: frontend
        run: |
          cat manifest.json | python3 -m json.tool > /dev/null
          echo "manifest.json is valid JSON"

      - name: Check Capacitor app (if present)
        working-directory: app
        run: |
          if [ -f package.json ]; then
            test -f capacitor.config.json
            cat capacitor.config.json | python3 -m json.tool > /dev/null
            echo "Capacitor config is valid"
          else
            echo "No Capacitor app directory"
          fi
