name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install 2>&1

      - name: Start server and test
        run: |
          cat > .env << EOF
          JWT_SECRET=ci_test_secret_key_for_github_actions_32_chars
          CRYPTO_SECRET=ci_test_crypto_secret_32_bytes_long!!
          VAPID_PUBLIC_KEY=
          VAPID_PRIVATE_KEY=
          STORAGE_DIR=./storage
          DB_PATH=./data/nka-bulletin.sqlite
          EOF
          node server.js > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          sleep 5
          echo "=== Server log ==="
          cat /tmp/server.log
          echo "=== Health check ==="
          curl -v http://localhost:4000/api/health 2>&1 || echo "Health check FAILED"
          echo "=== Other endpoints ==="
          curl -f http://localhost:4000/api/auth/password/status || echo "password/status FAILED"
          curl -f http://localhost:4000/api/settings || echo "settings FAILED"
          curl -f http://localhost:4000/api/stats/dashboard || echo "stats FAILED"
          kill $SERVER_PID 2>/dev/null
          wait $SERVER_PID 2>/dev/null

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Frontend files
        working-directory: frontend
        run: |
          ERR=0
          for f in index.html manifest.json sw.js js/api.js js/app.js js/pin.js js/dashboard.js js/accounts.js js/bulletins.js js/settings.js js/capacitor.js css/styles.css; do
            test -f "$f" && echo "  ok  $f" || { echo "  MISS  $f"; ERR=1; }
          done
          python3 -m json.tool manifest.json > /dev/null && echo "  ok  manifest.json is valid JSON" || { echo "  FAIL  manifest.json is invalid"; ERR=1; }
          exit $ERR

      - name: Validate Capacitor config
        working-directory: app
        run: |
          test -f package.json || { echo "No app directory"; exit 0; }
          test -f capacitor.config.json || { echo "MISSING capacitor.config.json"; exit 1; }
          python3 -m json.tool capacitor.config.json > /dev/null && echo "  ok  capacitor.config.json is valid JSON" || { echo "  FAIL  invalid JSON"; exit 1; }
